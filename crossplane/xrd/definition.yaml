# This is the "API" Backstage's scaffolder template will eventually target:
# a developer's form submission becomes a claim shaped like this.
#
# Deliberately NOT exposed here: resourceGroupName. Every claim lands in
# the one pre-scoped resource group from terraform/foundation, hardcoded
# in the Composition below - not passed through from the claim. Creating
# a resource group is subscription-level in Azure, so letting claims
# choose (or create) one would require broader-than-scoped permissions.
# Fixing it in the Composition keeps blast radius constant no matter what
# a future Backstage form passes through.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xstorageaccounts.storage.idp-demo.io
spec:
  group: storage.idp-demo.io
  names:
    kind: XStorageAccount
    plural: xstorageaccounts
  claimNames:
    kind: StorageAccountClaim
    plural: storageaccountclaims
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: Azure storage account name (lowercase, 3-24 chars, no hyphens).
                location:
                  type: string
                  description: Azure region.
                  default: westus2
                sku:
                  type: string
                  description: Replication SKU.
                  enum: ["Standard", "Premium"]
                  default: "Standard"
              required:
                - name
